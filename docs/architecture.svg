<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ansible AWS EC2 Nginx deployment architecture</title>
  <desc id="desc">Ansible on a Mac provisions an Ubuntu EC2 instance in AWS, discovers it with dynamic inventory, installs Nginx over SSH, and serves a templated sample web page over HTTP.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#14284b"/>
    </linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#ffe8c2"/>
    </linearGradient>
    <linearGradient id="controller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f2ff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fff5"/>
      <stop offset="1" stop-color="#c7f3de"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#62a8ff"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffab45"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#53d89a"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dce9ff; }
      .small { font-size: 18px; }
      .body { font-size: 21px; }
      .heading { font-size: 27px; font-weight: 700; }
      .title { font-size: 42px; font-weight: 750; letter-spacing: .5px; }
      .muted { fill: #9eb5d8; }
      .dark { fill: #172033; }
      .darkMuted { fill: #4f6586; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1500" cy="45" r="260" fill="#2b5591" opacity=".16"/>
  <circle cx="110" cy="820" r="220" fill="#1b8c88" opacity=".12"/>

  <text x="80" y="82" class="label title">Ansible → AWS EC2 → Nginx</text>
  <text x="80" y="122" class="label body muted">Provision infrastructure, configure the web server, and publish a sample page</text>
  <line x1="80" y1="154" x2="1520" y2="154" stroke="#365581" stroke-width="2"/>

  <!-- Control node -->
  <g filter="url(#shadow)">
    <rect x="80" y="265" width="310" height="310" rx="22" fill="url(#controller)"/>
  </g>
  <rect x="80" y="265" width="310" height="12" rx="6" fill="#4d8fe8"/>
  <text x="112" y="325" class="dark heading">Ansible control node</text>
  <text x="112" y="365" class="dark body">MacBook / local runner</text>
  <rect x="112" y="402" width="246" height="45" rx="10" fill="#fff" opacity=".82"/>
  <text x="130" y="431" class="dark mono">provision_ec2.yml</text>
  <rect x="112" y="460" width="246" height="45" rx="10" fill="#fff" opacity=".82"/>
  <text x="130" y="489" class="dark mono">configure_nginx.yml</text>
  <text x="112" y="540" class="darkMuted small">AWS credentials + SSH key</text>

  <!-- AWS boundary -->
  <rect x="460" y="205" width="1050" height="540" rx="28" fill="url(#aws)" stroke="#ffb35c" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="505" y="258" class="dark heading">AWS account · ap-south-1</text>
  <text x="505" y="290" class="darkMuted small">Existing networking prerequisites are reused by the playbook</text>

  <!-- AWS API / inventory -->
  <g filter="url(#shadow)">
    <rect x="505" y="335" width="300" height="160" rx="18" fill="#fff"/>
  </g>
  <circle cx="555" cy="385" r="27" fill="#ff9900"/>
  <text x="545" y="394" fill="#fff" font-size="26" font-weight="700">λ</text>
  <text x="600" y="375" class="dark heading">AWS APIs</text>
  <text x="600" y="408" class="dark body">EC2 provisioning</text>
  <text x="600" y="443" class="darkMuted small">Create / tag / start instance</text>
  <text x="600" y="468" class="darkMuted small">amazon.aws.ec2_instance</text>

  <g filter="url(#shadow)">
    <rect x="505" y="535" width="300" height="160" rx="18" fill="#fff"/>
  </g>
  <circle cx="555" cy="585" r="27" fill="#ff9900"/>
  <path d="M541 585h28M555 571v28" stroke="#fff" stroke-width="4"/>
  <text x="600" y="578" class="dark heading">Dynamic inventory</text>
  <text x="600" y="611" class="dark body">amazon.aws.aws_ec2</text>
  <text x="600" y="646" class="darkMuted small">Find running web instances</text>
  <text x="600" y="671" class="darkMuted small">tag:Role = web</text>

  <!-- Network prerequisites -->
  <rect x="865" y="252" width="270" height="100" rx="15" fill="#fff" stroke="#ffd296" stroke-width="2"/>
  <text x="895" y="287" class="dark heading">VPC + subnet</text>
  <text x="895" y="319" class="darkMuted small">Public route via Internet Gateway</text>
  <rect x="1165" y="252" width="300" height="100" rx="15" fill="#fff" stroke="#ffd296" stroke-width="2"/>
  <text x="1195" y="287" class="dark heading">Security group</text>
  <text x="1195" y="319" class="darkMuted small">SSH 22 · HTTP 80</text>

  <!-- EC2 server -->
  <g filter="url(#shadow)">
    <rect x="865" y="395" width="600" height="300" rx="22" fill="url(#server)"/>
  </g>
  <rect x="865" y="395" width="600" height="12" rx="6" fill="#2dbe78"/>
  <text x="905" y="455" class="dark heading">EC2 instance · Ubuntu</text>
  <text x="905" y="488" class="darkMuted small">tagged Project=ansible-nginx-web · Role=web</text>
  <rect x="905" y="525" width="240" height="115" rx="14" fill="#fff" opacity=".85"/>
  <text x="935" y="562" class="dark heading">Nginx</text>
  <text x="935" y="594" class="dark body">service enabled</text>
  <text x="935" y="622" class="darkMuted small">listens on :80</text>
  <rect x="1180" y="525" width="240" height="115" rx="14" fill="#fff" opacity=".85"/>
  <text x="1210" y="562" class="dark heading">Sample page</text>
  <text x="1210" y="594" class="dark body">index.html</text>
  <text x="1210" y="622" class="darkMuted small">/var/www/html/</text>

  <!-- Internet client -->
  <g filter="url(#shadow)">
    <rect x="80" y="675" width="310" height="120" rx="18" fill="#fff"/>
  </g>
  <circle cx="125" cy="735" r="27" fill="#53d89a"/>
  <path d="M110 737c9-20 21-20 30 0M111 727h28M112 744h26" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="170" y="729" class="dark heading">Web client</text>
  <text x="170" y="761" class="darkMuted small">http://PUBLIC_IP/</text>

  <!-- Flow arrows -->
  <path d="M390 375 C430 375 455 375 505 400" fill="none" stroke="#62a8ff" stroke-width="5" marker-end="url(#blueArrow)"/>
  <text x="398" y="350" class="label small">AWS API</text>
  <path d="M390 478 C445 478 460 600 505 610" fill="none" stroke="#62a8ff" stroke-width="5" marker-end="url(#blueArrow)"/>
  <text x="398" y="520" class="label small">discover</text>
  <path d="M805 415 C830 415 840 480 865 500" fill="none" stroke="#ffab45" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <text x="813" y="395" class="label small">provision</text>
  <path d="M805 615 C830 615 840 580 865 580" fill="none" stroke="#53d89a" stroke-width="5" marker-end="url(#greenArrow)"/>
  <text x="810" y="650" class="label small">SSH + Ansible</text>
  <path d="M1010 352 C1010 375 1010 385 1010 395" fill="none" stroke="#d79a4b" stroke-width="3"/>
  <path d="M1315 352 C1315 370 1315 380 1315 395" fill="none" stroke="#d79a4b" stroke-width="3"/>
  <path d="M390 735 C650 735 800 735 980 695" fill="none" stroke="#53d89a" stroke-width="5" marker-end="url(#greenArrow)"/>
  <text x="495" y="777" class="label small">HTTP response · rendered sample web page</text>

  <!-- Legend -->
  <text x="865" y="790" class="label small muted">Flow</text>
  <line x1="920" y1="784" x2="980" y2="784" stroke="#62a8ff" stroke-width="4"/>
  <text x="992" y="790" class="label small muted">AWS control / discovery</text>
  <line x1="1190" y1="784" x2="1250" y2="784" stroke="#53d89a" stroke-width="4"/>
  <text x="1262" y="790" class="label small muted">Configuration / web traffic</text>

  <text x="80" y="850" class="label small muted">Infrastructure prerequisites: VPC, subnet, security group, EC2 key pair, and Ubuntu AMI</text>
  <text x="1520" y="850" text-anchor="end" class="label small muted">Managed by Ansible</text>
</svg>
